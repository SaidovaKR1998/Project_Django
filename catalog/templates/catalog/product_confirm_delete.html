{% extends 'catalog/includes/base.html' %}

{% block title %}Удаление {{ product.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title">Подтверждение удаления</h2>
                <p>Вы уверены, что хотите удалить товар <strong>"{{ object.name }}"</strong>?</p>
                <p>Это действие нельзя будет отменить.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
