{% extends 'catalog/includes/base.html' %}

{% block title %}{{ product.name }} - SkyStore{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8">
        <!-- ... существующий код ... -->
    </div>
</div>

<div class="mt-4">
    {% if user.is_authenticated %}
    <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-warning">
        <i class="bi bi-pencil me-1"></i>Редактировать
    </a>
    <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-danger">
        <i class="bi bi-trash me-1"></i>Удалить
    </a>
    {% endif %}
    <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left me-1"></i>Назад к списку
    </a>
</div>
{% endblock %}
