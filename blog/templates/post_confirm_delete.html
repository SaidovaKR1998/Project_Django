{% extends 'base.html' %}

{% block title %}Удаление статьи - SkyStore{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow border-0">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Удаление статьи</h4>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить статью "{{ object.title }}"?</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Удалить</button>
                            <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
